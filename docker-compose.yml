services:
  churn-api:
    build:
      context: ./churn_prediction
      dockerfile: Dockerfile
    container_name: churn-prediction-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  videogame-api:
    build:
      context: ./videogame_sales_prediction
      dockerfile: Dockerfile
    container_name: videogame-sales-api
    ports:
      - "8001:8001"
    restart: unless-stopped
